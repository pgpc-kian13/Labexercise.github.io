<!DOCTYPE html>
<html>
<head>
<title>My Web Development Course</title>
<link rel="stylesheet" href="12d.css">
</head>
<body>

  <nav class="nav">
    <ul>
      <li><a href="#topics">Topics</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="9.html">Back to Exercise 9</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>My Web Development Course</h1>
    <h2>(Part B)</h2>
    <p>Welcome to my webpage.</p>
  </header>

  <section id="topics" class="topics">
    <h2>Topics</h2>
    <div class="list">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
    </div>
  </section>

  <section id="projects" class="projects">
    <h2>My Projects</h2>
    <div class="grid">
      <div class="card">
        <img src="f.jpg" alt="Preview of Project 1">
        <h3>Project 1</h3>
      </div>
      <div class="card">
        <img src="e.png" alt="Preview of Project 2">
        <h3>Project 2</h3>
      </div>
      <div class="card">
        <img src="yes.png" alt="Preview of Project 3">
        <h3>Project 3</h3>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact Me</h2>
    <form class="form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@email.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Write your message here..."></textarea>

      <button type="submit" class="button">Submit</button>
    </form>
  </section>

</body>
</html>
